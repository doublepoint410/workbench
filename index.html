<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B8860B">
<link rel="apple-touch-icon" href="icon.png">
<title>我的工作台</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf6ee;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
  .card{text-align:center;padding:40px 24px}
  .dot{width:38px;height:38px;margin:0 auto 18px;border-radius:50%;background:#E9A319;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.92)}}
  h1{font-size:18px;color:#3a3a3a;font-weight:600;margin:0 0 8px}
  p{font-size:14px;color:#8a8a8a;margin:0}
  .err{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="dot"></div>
  <h1>正在连接工作台…</h1>
  <p id="msg">请稍候，自动跳转中</p>
</div>
<script>
fetch('url.txt',{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
  var u=(t||'').replace(/\s+/g,'');
  if(/^https?:\/\//.test(u)){location.replace(u);}
  else{document.getElementById('msg').textContent='地址配置异常，请稍后再试';}
}).catch(function(){
  document.getElementById('msg').textContent='暂时无法连接，请检查网络后重试';
});
</script>
</body>
</html>
